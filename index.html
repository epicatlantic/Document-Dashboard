<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIC ATLANTIC | Project Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme Variables */
            --bg-top: #ffffff;
            --bg-bottom: #f1f5f9;
            /* UPDATED: wordmark now uses the same accent blue as Dashboard.html
               instead of orange, so the two pages read as one product rather
               than two different palettes. Orange is left free to stay a
               one-time accent on the flame icon in the logo itself. */
            --primary-text: #0284c7;
            --secondary-text: #64748b;
            --accent-blue: #0284c7; /* Professional corporate blue */
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(15, 23, 42, 0.08);
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            /* Light Gradient */
            background: radial-gradient(circle at top right, var(--bg-top), var(--bg-bottom));
            color: var(--primary-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* overflow: hidden; removed to allow scrolling */
        }

        /* 1. Professional Light Glass Header */
        header {
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .logo-box { display: flex; align-items: center; gap: 15px; }
        .logo-box img { width: 40px; }
        .logo-box h1 { 
            font-size: 1.2rem; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin: 0; 
            color: var(--primary-text);
        }

        /* UPDATED: given a touch more weight/size and its own line so it
           reads as a deliberate subtitle instead of floating gray text
           disconnected from the header. */
        .header-status-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .header-status {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--secondary-text);
            letter-spacing: 1.5px;
        }

        /* 2. Hero Slideshow Container */
        .hero-section {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .slideshow-container {
            width: 100%;
            max-width: 1100px;
            height: 520px;
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            background: #fff;
            border: 1px solid var(--glass-border);
            box-shadow: var(--card-shadow);
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc; /* Very light grey background for images */
        }

        .slide.active { opacity: 1; }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Keeps maps readable */
        }

        /* Slide Nav Arrows */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid var(--glass-border);
            color: var(--secondary-text);
            font-size: 24px;
            font-weight: bold;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            transition: all 0.3s ease;
            user-select: none;
        }

        .nav-btn:hover {
            background: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
        }

        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        /* 3. Light Glass Floating Overlay */
        .hero-overlay {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 25px 50px;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            text-align: center;
            z-index: 10;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .hero-overlay h2 {
            font-size: 0.85rem;
            margin: 0 0 12px 0;
            color: var(--secondary-text);
            letter-spacing: 2px;
            font-weight: 600;
        }

        .dashboard-btn {
            background: var(--accent-blue);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
        }

        .dashboard-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.4);
            filter: brightness(1.1);
        }

        /* Pagination Dots */
        .dot-container {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            z-index: 12;
        }

        .dot {
            height: 8px;
            width: 8px;
            margin: 0 6px;
            background-color: #cbd5e1;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active { 
            background-color: var(--accent-blue); 
            width: 24px; 
            border-radius: 4px; 
        }

        /* NEW: slide caption badge — top-left of the slideshow, updates per slide */
        .slide-caption {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--text-main, #1e293b);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 8px 18px;
            border-radius: 100px;
            z-index: 15;
            transition: opacity 0.3s ease;
        }

        /* NEW: thin progress bar showing time remaining before auto-advance */
        .slide-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: var(--accent-blue);
            z-index: 16;
            transition: width linear;
        }

        @media (max-width: 768px) {
            header { padding: 20px; }
            .header-status { display: none; }
            .hero-overlay { width: 80%; padding: 20px; bottom: 40px; border-radius: 24px; }
            .nav-btn { width: 40px; height: 40px; font-size: 18px; }
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
            .slide-caption { top: 12px; left: 12px; font-size: 0.7rem; padding: 6px 14px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <img src="logo.png" alt="Epic Logo">
            <h1>Epic Atlantic</h1>
        </div>
        <div class="header-status-group">
            <div class="header-status">PROJECT MANAGEMENT PORTAL</div>
        </div>
    </header>

    <main class="hero-section">
        <div class="slideshow-container">
            <!--
                NOTE: "Akabel coordinates.PNG" is the raw Google My Maps screenshot
                (visible Google watermark + My Maps' own pagination dots baked into
                the image). It's left in its original position for now, but it's
                worth re-exporting a clean crop of just the map before this goes
                live, since it currently looks like an unfinished screenshot next
                to the other polished slides.

                CAPTIONS: each slide has a data-caption attribute feeding the
                badge in the top-left corner. The labels below are my best
                guess from the filenames — swap in the real site/feature names
                where I've guessed wrong.
            -->
            <div class="slide active" data-caption="Site Airstrip"><img src="Airstrip.PNG"></div>
            <div class="slide" data-caption="Project Overview"><img src="Picture1.png"></div>
            <div class="slide" data-caption="Burnt Ships"><img src="Burnt ships.PNG"></div>
            <div class="slide" data-caption="Loading Operations"><img src="Picture5.png"></div>
            <div class="slide" data-caption="Site Photograph"><img src="Picture5.png"></div>
            <div class="slide" data-caption="Pipeline src="Picture4.png"></div>
            <div class="slide" data-caption="Pipeline Route Map – OKNU to Akabel"><img src="Akabel coordinates.PNG"></div>
            
            <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous slide">&#10094;</button>
            <button class="nav-btn next-btn" id="nextBtn" aria-label="Next slide">&#10095;</button>

            <div class="slide-caption" id="slideCaption"></div>
            <div class="slide-progress" id="slideProgress"></div>
            <div class="dot-container" id="dotGroup"></div>
        </div>

        <div class="hero-overlay">
            <h2>BRASS FERTILIZER METHANOL PRODUCTION PROJECT</h2>
            <a href="Dashboard.html" class="dashboard-btn">Document Dashboard</a>
        </div>
    </main>

    <script>
        let currentSlide = 0;
        let slideInterval;
        let progressTimer;
        const SLIDE_DURATION = 5000; // ms — keep in sync with startTimer's interval below
        const slides = document.querySelectorAll('.slide');
        const dotGroup = document.getElementById('dotGroup');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const captionEl = document.getElementById('slideCaption');
        const progressEl = document.getElementById('slideProgress');
        const slideshowContainer = document.querySelector('.slideshow-container');

        // Dynamically create dots
        slides.forEach((_, i) => {
            const dot = document.createElement('span');
            dot.classList.add('dot');
            if(i === 0) dot.classList.add('active');
            dot.onclick = () => {
                goToSlide(i);
                resetTimer();
            };
            dotGroup.appendChild(dot);
        });

        const dots = document.querySelectorAll('.dot');

        function goToSlide(n) {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');
            currentSlide = (n + slides.length) % slides.length; // Handles negative values smoothly
            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
            updateCaption();
        }

        // NEW: syncs the top-left badge with whichever slide is active
        function updateCaption() {
            const label = slides[currentSlide].dataset.caption || '';
            captionEl.textContent = label;
        }

        function nextSlide() {
            goToSlide(currentSlide + 1);
        }

        function prevSlide() {
            goToSlide(currentSlide - 1);
        }

        // Arrow click events
        nextBtn.onclick = () => {
            nextSlide();
            resetTimer();
        };

        prevBtn.onclick = () => {
            prevSlide();
            resetTimer();
        };

        // Keyboard navigation (optional but great for user experience)
        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft") {
                prevSlide();
                resetTimer();
            } else if (e.key === "ArrowRight") {
                nextSlide();
                resetTimer();
            }
        });

        // Auto play timer controls
        function startTimer() {
            slideInterval = setInterval(nextSlide, SLIDE_DURATION);
            startProgress();
        }

        function resetTimer() {
            clearInterval(slideInterval);
            startTimer(); // Restarts the 5s clock so it doesn't change immediately after clicking
        }

        // NEW: fills the thin top progress bar over the autoplay duration,
        // giving a visual cue before the slide auto-advances
        function startProgress() {
            progressEl.style.transition = 'none';
            progressEl.style.width = '0%';
            // Force a reflow so the transition below actually animates from 0%
            void progressEl.offsetWidth;
            progressEl.style.transition = `width ${SLIDE_DURATION}ms linear`;
            progressEl.style.width = '100%';
        }

        function pauseProgress() {
            const computedWidth = getComputedStyle(progressEl).width;
            progressEl.style.transition = 'none';
            progressEl.style.width = computedWidth;
        }

        // NEW: pause autoplay while the mouse is over the slideshow, so
        // people can actually read a slide without it flipping away
        slideshowContainer.addEventListener('mouseenter', () => {
            clearInterval(slideInterval);
            pauseProgress();
        });
        slideshowContainer.addEventListener('mouseleave', () => {
            resetTimer();
        });

        // NEW: swipe support for touch devices — left/right swipe changes slides
        let touchStartX = 0;
        slideshowContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            clearInterval(slideInterval);
            pauseProgress();
        }, { passive: true });

        slideshowContainer.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const delta = touchEndX - touchStartX;
            const SWIPE_THRESHOLD = 50;
            if (delta > SWIPE_THRESHOLD) {
                prevSlide();
            } else if (delta < -SWIPE_THRESHOLD) {
                nextSlide();
            }
            resetTimer();
        }, { passive: true });

        // Initialize caption for the first slide, then start the slider
        updateCaption();
        startTimer();
    </script>
</body>
</html>
